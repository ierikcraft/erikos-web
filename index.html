<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ErikOS 14</title>
    <style>
        /* Estilos Base Minimalistas */
        body, html {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #111111;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* Selector de Idioma (Arriba a la derecha) */
        .header {
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: flex-end;
            position: absolute;
            top: 0;
            z-index: 10;
        }

        .lang-select {
            background: rgba(0, 0, 0, 0.03);
            backdrop-filter: blur(10px);
            color: #111;
            border: 1px solid rgba(0, 0, 0, 0.1);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            appearance: none;
        }

        .lang-select option { background: #fff; color: #000; }

        /* Contenedor principal */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            margin-top: 60px;
            margin-bottom: 40px;
        }

        /* Logo y Título */
        .logo-area { margin-bottom: 30px; }

        .os-title {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: -2px;
            margin: 0;
            color: #000;
        }

        /* Botón de Descarga Minimalista */
        .download-btn {
            background-color: #fff;
            color: #000;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid #e0e0e0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: inline-flex;
            align-items: center;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        /* === Botón de Seguridad Secundario === */
        .security-action-btn {
            display: inline-block;
            margin-top: 15px;
            background: #fff;
            color: #555;
            padding: 8px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
            border: 1px solid #eaeaea;
            transition: all 0.2s ease;
        }

        .security-action-btn:hover {
            background: #f9f9f9;
            color: #000;
            border-color: #ccc;
        }

        /* Sección Comunidad */
        .community-section {
            margin-top: 60px;
            background: #fafafa;
            border-radius: 20px;
            padding: 25px;
            border: 1px solid #eaeaea;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.03);
        }

        .community-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .links-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .github-link {
            display: inline-flex;
            align-items: center;
            background: #fff;
            color: #333;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9rem;
            border: 1px solid #eaeaea;
            transition: all 0.2s ease;
        }

        .github-link:hover {
            background: #f5f5f5;
            color: #000;
            border-color: #d0d0d0;
        }

        .gh-icon { width: 16px; height: 16px; margin-right: 8px; fill: currentColor; }

        footer { padding: 20px; font-size: 0.8rem; color: #888; text-align: center; }
    </style>
</head>

    <script>
        const translations = {
            es: {
                title: "ErikOS for all",
                downloadPC: "PC",
                downloadMini: "Erik Mini",
                downloadAndroid: "Android",
                community: "Únete a la Comunidad",
                ghOfficial: "GitHub Oficial",
                ghDisc: "Discusiones y Votos",
                ghWiki: "Wiki Técnica",
                footer: "Hecho con ❤️ por Erik. ErikOS es un proyecto de código abierto."
            },
            en: {
                title: "ErikOS for all",
                downloadPC: "PC",
                downloadMini: "Erik Mini",
                downloadAndroid: "Android",
                community: "Join the Community",
                ghOfficial: "Official GitHub",
                ghDisc: "Discussions & Voting",
                ghWiki: "Technical Wiki",
                footer: "Made with ❤️ by Erik. ErikOS is an open-source project."
            }
        };

        function changeLanguage(lang) {
            // Cambiar los textos estándar usando los IDs
            document.getElementById("text-title").innerText = translations[lang].title;
            document.getElementById("text-download-pc").innerText = translations[lang].downloadPC;
            document.getElementById("text-download-mini").innerText = translations[lang].downloadMini;
            document.getElementById("text-download-android").innerText = translations[lang].downloadAndroid;
            document.getElementById("text-community").innerText = translations[lang].community;
            document.getElementById("text-gh-official").innerText = translations[lang].ghOfficial;
            document.getElementById("text-gh-disc").innerText = translations[lang].ghDisc;
            document.getElementById("text-gh-wiki").innerText = translations[lang].ghWiki;
            document.getElementById("text-footer").innerText = translations[lang].footer;

            // === LÓGICA CLAVE: Mostrar/Ocultar botón de seguridad (Solo Inglés) ===
            const securityBtn = document.getElementById('security-btn');
            if (lang === 'en') {
                securityBtn.style.display = 'inline-block'; // Mostrar si es Inglés
            } else {
                securityBtn.style.display = 'none'; // Ocultar si es Español u otro
            }
            
            // Actualizar el selector y el idioma del documento
            document.getElementById("langSelector").value = lang;
            document.documentElement.lang = lang;
        }

        // Detectar el idioma automáticamente al entrar
        window.onload = function() {
            let userLang = navigator.language.slice(0, 2); 
            let defaultLang = (userLang === 'es') ? 'es' : 'en';
            changeLanguage(defaultLang);
        };
    </script>
